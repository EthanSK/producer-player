name: CodeQL
run-name: >-
  ${{ (github.event.head_commit
      && startsWith(github.event.head_commit.message, 'chore: bump version')
      && github.event.commits[0].message != github.event.head_commit.message
      && github.event.commits[0].message)
      || (github.event.head_commit && github.event.head_commit.message)
      || '' }}

on:
  push:
    branches:
      - main
      - master
    # Keep push-triggered CodeQL for shipping/source changes. Planning docs and
    # workflow-maintenance commits are still covered by the weekly schedule and
    # by pull_request runs when they are reviewed through PRs.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'experimental-mobile-app/**'
      - 'references/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PLAN.md'
      - 'CHANGELOG.md'
      - 'LEARNINGS.md'
      - 'site/version.json'
      - 'scripts/check-version-consistency.mjs'
      - 'scripts/check-version-bump.mjs'
      - 'scripts/sync-version.mjs'
      - 'scripts/install-git-hooks.mjs'
      - 'scripts/run-pre-push-version-check.mjs'
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '17 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
